<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="Two columns of code, Hazel and Fumola, side by side.">
<g font-family="ui-monospace,monospace" font-size="11">
<text x="14" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#c4b5fd">Hazel</text>
<text x="128" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#67e8f9">Fumola</text>
<text x="14" y="52" fill="#e5e7eb">case e</text><text x="128" y="52" fill="#e5e7eb">switch (e) {</text>
<text x="14" y="70" fill="#e5e7eb">| Way(d) =&gt;</text><text x="128" y="70" fill="#e5e7eb">case (#Way(d))</text>
<text x="14" y="88" fill="#e5e7eb">Some(x)</text><text x="128" y="88" fill="#e5e7eb">?x</text>
<text x="14" y="106" fill="#e5e7eb">a ++ b</text><text x="128" y="106" fill="#e5e7eb">a # b</text>
<text x="14" y="124" fill="#e5e7eb">(col = 1, ...)</text><text x="128" y="124" fill="#e5e7eb">{ col = 1; ... }</text>
</g>
<line x1="120" y1="36" x2="120" y2="132" stroke="#9ca3af" stroke-width="1.5"/>
</svg>
